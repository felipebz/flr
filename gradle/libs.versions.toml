[versions]
kotlin = "2.4.21"
dokka = "2.3.0"
jreleaser = "1.27.0"
sonarscanner = "7.6.0.18749"
spotless = "8.12.0"
jmh-plugin = "0.7.4"
# JGit on the build class path: JReleaser needs JGit 5 (JGit 7 removed classes it uses).
jgit = "5.13.5.202508271544-r"

# libs
asm = "9.11.1"
jaxen = "2.0.6"

# testing
assertj = "3.27.7"
junit = "6.1.3"
mockito = "5.24.0"
mockito-kotlin = "6.4.0"

[libraries]
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jaxen = { module = "jaxen:jaxen", version.ref = "jaxen" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarscanner" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }
